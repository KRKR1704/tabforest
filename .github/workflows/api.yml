name: api

# Pull requests: lint and test. Push to main: lint, test, migrate, deploy.
# Only apps/api/tests runs here (never tests_local, which is not in the repo).

on:
  pull_request:
    paths: ["apps/api/**", "db/**", "contracts/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "apps/grove/**", "db/**", "contracts/**", ".github/workflows/api.yml"]

permissions:
  contents: read

# Serialized, never cancelled while running. GitHub keeps one running and one pending run per concurrency group
# and replaces the older pending one, so the groups are per job: database tests queue among themselves (they
# share Tiger Cloud; the story fixture also takes a database lock), and deploys queue in their own group where
# a pull-request run can never replace a deploy that is waiting.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Tests without a database (fast gate; the database tests skip)
        env:
          DATABASE_URL: ""
        run: uv run pytest tests app/engine/tests -m "not live" -q

  # The database tests run against Tiger Cloud and take a while from a runner, so they run beside the
  # fast gate instead of in front of the deploy. One workflow run at a time (see concurrency above).
  database-tests:
    concurrency:
      group: api-database
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Tests with the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run pytest tests app/engine/tests -m "not live" -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: api-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Apply migrations (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --project apps/api python db/migrate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/grove/package-lock.json
      - name: Build the landing page into the app (served at /welcome/)
        working-directory: apps/grove
        run: |
          npm ci --no-audit --no-fund
          npm run build:landing
          cp -r build/landing ../api/app/welcome_site
      - name: Build the zip (app code and a pinned requirements.txt; no tests)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
          zip -qr ../../api.zip app requirements.txt .python-version -x "app/engine/tests/*" "*/__pycache__/*"
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: tabforest
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
      - name: Check the deployed API
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tabforest.azurewebsites.net/health) && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "health check failed"; exit 1
      - name: The landing page is served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -L https://tabforest.azurewebsites.net/welcome/)
          [ "$code" = 200 ] || { echo "expected 200 at /welcome/, got $code"; exit 1; }
      - name: The dev header alone must not authenticate
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Dev-User: 00000000-0000-4000-8000-000000000001" https://tabforest.azurewebsites.net/api/me)
          [ "$code" = 401 ] || { echo "expected 401, got $code"; exit 1; }
